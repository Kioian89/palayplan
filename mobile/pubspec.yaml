name: palayplan
description: Smart Agro-Weather Mobile Application for Rice Yield and Schedule Optimization
publish_to: 'none'
version: 0.3.1+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  http: ^1.2.2
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  table_calendar: ^3.1.2
  flutter_localizations:
    sdk: flutter
  tflite_flutter: ^0.12.1
  image_picker: ^1.2.4
  image: ^4.12.0
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^6.2.2
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/icons/
    - assets/images/
    - shorebird.yaml
