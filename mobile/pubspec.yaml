name: palayplan
description: Smart Agro-Weather Mobile Application for Rice Yield and Schedule Optimization
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  table_calendar: ^3.1.2
  flutter_localizations:
    sdk: flutter
  tflite_flutter: ^0.12.1
  image_picker: ^1.2.4
  image: ^4.12.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/icons/
    - assets/images/
