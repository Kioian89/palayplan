name: Build PalayPlan APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant or action'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - patch
          - debug

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Environment
        run: |
          flutter --version
          java -version
          shorebird --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test
        continue-on-error: true

      - name: Publish Shorebird OTA Patch
        if: "${{ github.event.inputs.build_type == 'patch' }}"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird patch android \
            --allow-asset-diffs \
            --allow-native-diffs \
            --dart-define=API_BASE_URL=https://palayplan.onrender.com

      - name: Build APK (Release / Shorebird)
        if: "${{ github.event.inputs.build_type != 'debug' && github.event.inputs.build_type != 'patch' }}"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [ -n "$SHOREBIRD_TOKEN" ] && ([ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] || [ "${{ github.event.inputs.build_type }}" = "release" ]); then
            echo "Building with Shorebird release..."
            shorebird release android --artifact apk \
              --dart-define=API_BASE_URL=https://palayplan.onrender.com
          else
            echo "Building standard release APK..."
            flutter build apk --release \
              --dart-define=API_BASE_URL=https://palayplan.onrender.com
          fi

      - name: Build APK (Debug)
        if: "${{ github.event.inputs.build_type == 'debug' }}"
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=https://palayplan.onrender.com

      - name: Upload APK Artifact
        if: "${{ github.event.inputs.build_type != 'patch' }}"
        uses: actions/upload-artifact@v4
        with:
          name: palayplan-apk
          path: mobile/build/app/outputs/flutter-apk/app-*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-*.apk
          name: "PalayPlan ${{ github.ref_name }}"
          generate_release_notes: true
